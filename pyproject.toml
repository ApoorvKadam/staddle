[project]
name = "staddle"
version = "0.1.0"
description = "Operations reconciliation for self-storage, checked against the FMS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
chat = ["anthropic>=2.6"]
dev = ["pytest>=8", "pytest-xdist>=3.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["desk*", "fmssim*", "fms_checks*", "core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the two whole-evaluation tests take about 4 minutes each, so they run in their own job: pytest -m evaluation
addopts = "-m 'not evaluation'"
markers = ["evaluation: runs a whole evaluation end to end (minutes); selected with -m evaluation"]

[tool.setuptools.package-data]
desk = ["reference/*.csv", "templates/*.html", "static/*", "reading_set.json"]
core = ["graded/*.json", "graded/*.md"]
